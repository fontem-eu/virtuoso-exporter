name: build-sign-push

# Release by pushing a v<semver> tag or by dispatching with the tag. The
# image is a sidecar pinned by digest in gitops (infra/prod.yaml), so a
# build never deploys by itself.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, e.g. 0.2.0'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      # The shared action builds, pushes by digest, signs, and attests the
      # SBOM and SLSA provenance, like the other fontem images. The runtime
      # is distroless and non-root, so nothing is allowed past the minimal
      # check.
      - name: Build, push, sign, attest
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/virtuoso-exporter
          tag: ${{ steps.tag.outputs.value }}
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          minimal-enforce: "true"
